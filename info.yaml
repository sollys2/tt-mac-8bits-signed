# Tiny Tapeout project information
project:
  title:        "tt-mac-8bits-signed"      # Project title
  author:       "Pham Van Chien - Le Hong Phuc"      # Your name
  discord:      "dazzling_mango_50820"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Parameterizable signed 8-bit MAC unit that multiplies inputs and accumulates results each clock cycle"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mac"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "mac_unit.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "in_a[0]"
  ui[1]: "in_a[1]"
  ui[2]: "in_a[2]"
  ui[3]: "in_a[3]"
  ui[4]: "in_a[4]"
  ui[5]: "in_a[5]"
  ui[6]: "in_a[6]"
  ui[7]: "in_a[7]"

  # Outputs
  uo[0]: "out_acc[0]"
  uo[1]: "out_acc[1]"
  uo[2]: "out_acc[2]"
  uo[3]: "out_acc[3]"
  uo[4]: "out_acc[4]"
  uo[5]: "out_acc[5]"
  uo[6]: "out_acc[6]"
  uo[7]: "out_acc[7]"

  # Bidirectional pins
  uio[0]: "in_b[0]"
  uio[1]: "in_b[1]"
  uio[2]: "in_b[2]"
  uio[3]: "in_b[3]"
  uio[4]: "in_b[4]"
  uio[5]: "in_b[5]"
  uio[6]: "in_b[6]"
  uio[7]: "in_b[7]"

# Do not change!
yaml_version: 6
