project:
  title:        "tt-mac-8bits-signed"
  author:       "Pham Van Chien - Le Hong Phuc"
  discord:      "dazzling_mango_50820"
  description:  "Parameterizable signed 8-bit MAC unit that multiplies inputs and accumulates results each clock cycle"
  language:     "Verilog"
  clock_hz:     0

  tiles: "1x1"

  top_module:  "tt_um_mac"

  source_files:
    - "mac_unit.v"

pinout:
  # Inputs
  ui[0]: "in_a[0]"
  ui[1]: "in_a[1]"
  ui[2]: "in_a[2]"
  ui[3]: "in_a[3]"
  ui[4]: "in_a[4]"
  ui[5]: "in_a[5]"
  ui[6]: "in_a[6]"
  ui[7]: "in_a[7]"

  # Outputs
  uo[0]: "out_acc[0]"
  uo[1]: "out_acc[1]"
  uo[2]: "out_acc[2]"
  uo[3]: "out_acc[3]"
  uo[4]: "out_acc[4]"
  uo[5]: "out_acc[5]"
  uo[6]: "out_acc[6]"
  uo[7]: "out_acc[7]"

  # Bidirectional pins
  uio[0]: "in_b[0]"
  uio[1]: "in_b[1]"
  uio[2]: "in_b[2]"
  uio[3]: "in_b[3]"
  uio[4]: "in_b[4]"
  uio[5]: "in_b[5]"
  uio[6]: "in_b[6]"
  uio[7]: "in_b[7]"

yaml_version: 6
